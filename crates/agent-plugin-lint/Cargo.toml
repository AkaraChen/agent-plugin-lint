[package]
name = "agent-plugin-lint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline, read-only Agent Plugins linter"
include = ["src/**", "schemas/**", "LICENSE", "THIRD_PARTY.md", "Cargo.toml"]

[[bin]]
name = "ap-lint"
path = "src/main.rs"

[dependencies]
agent-skills-lint = { path = "../agent-skills-lint", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
semver = "1"
libc = "0.2"
url = "2"
http = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
sha2 = "0.10"
tempfile.workspace = true
