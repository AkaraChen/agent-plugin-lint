[workspace]
members = ["crates/agent-skills-lint", "crates/agent-plugin-lint"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AkaraChen/agent-plugin-lint"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
serde-saphyr = "1.3"
